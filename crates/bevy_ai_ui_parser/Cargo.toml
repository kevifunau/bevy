[package]
name = "bevy_ai_ui_parser"
version = "0.1.0"
edition = "2024"
description = "A JSON-driven UI parser plugin for Bevy"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "ui", "json"]

[features]
default = []
editor = [
    "dep:bevy_egui",
    "dep:bevy_inspector_egui",
    "dep:egui_dock",
    "dep:rfd",
]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.19.0" }
bevy_asset = { path = "../bevy_asset", version = "0.19.0" }
bevy_camera = { path = "../bevy_camera", version = "0.19.0" }
bevy_color = { path = "../bevy_color", version = "0.19.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0" }
bevy_image = { path = "../bevy_image", version = "0.19.0" }
bevy_input = { path = "../bevy_input", version = "0.19.0" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.19.0" }
bevy_log = { path = "../bevy_log", version = "0.19.0" }
bevy_math = { path = "../bevy_math", version = "0.19.0" }
bevy_picking = { path = "../bevy_picking", version = "0.19.0" }
bevy_window = { path = "../bevy_window", version = "0.19.0" }
bevy_text = { path = "../bevy_text", version = "0.19.0" }
bevy_time = { path = "../bevy_time", version = "0.19.0" }
bevy_ui = { path = "../bevy_ui", version = "0.19.0" }
bevy_ui_widgets = { path = "../bevy_ui_widgets", version = "0.19.0" }

# editor (optional)
bevy = { path = "../../", features = ["bevy_ui_widgets"], optional = true }
bevy_egui = { version = "0.40", optional = true }
bevy_inspector_egui = { version = "0.37", package = "bevy-inspector-egui", optional = true }
egui_dock = { version = "0.19", optional = true }
rfd = { version = "0.17", optional = true }

# other
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
roxmltree = "0.21.1"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

[[bin]]
name = "bui_editor"
path = "src/bin/bui_editor/main.rs"
required-features = ["editor"]

[[bin]]
name = "compile_opendesign_html"
path = "src/bin/compile_opendesign_html.rs"

[[bin]]
name = "validate_bui"
path = "src/bin/validate_bui.rs"

[lints]
workspace = true

[dev-dependencies]
bevy = { path = "../../", features = ["bevy_ui_widgets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

