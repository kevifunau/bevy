<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1365, initial-scale=1.0" />
<title>登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
    background: #1a1a2e;
    color: #ffffff;
  }

  .game-stage {
    width: 1365px;
    height: 768px;
    position: relative;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ===== LoginBKPanel: Full screen background ===== */
  .login-bk {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .login-bk img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ===== LoginPanel ===== */
  .login-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 460px;
    padding: 40px 50px 35px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    row-gap: 18px;
    background: rgba(20, 20, 35, 0.85);
    border: 2px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
  }

  /* ===== imgUN / imgPW: Input background ===== */
  .input-wrapper {
    height: 42px;
    background-image: url("Asset/input_frame.png");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    display: flex;
    align-items: center;
    padding: 0 12px;
  }
  .input-wrapper input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 16px;
    outline: none;
  }
  .input-wrapper input::placeholder {
    color: #888;
  }

  /* ===== txtUN / txtPW: Labels ===== */
  .form-label { font-size: 14px; color: #ccc; padding-left: 4px; }
  .form-row { display: flex; flex-direction: column; row-gap: 6px; }

  /* ===== Toggle: Background + Checkmark + Label ===== */
  .toggle-row { display: flex; flex-direction: row; align-items: center; column-gap: 30px; padding-left: 4px; }
  .toggle { display: flex; flex-direction: row; align-items: center; column-gap: 6px; cursor: pointer; }
  .toggle input[type="checkbox"] {
    appearance: none;
    width: 32px;
    height: 32px;
    background-image: url("Asset/checkbox_bg.png");
    background-repeat: no-repeat;
    background-size: contain;
    cursor: pointer;
  }
  .toggle input[type="checkbox"]:checked {
    background-image: url("Asset/checkmark.png");
  }
  .toggle-label { font-size: 14px; color: #ccc; }

  /* ===== Buttons ===== */
  .button-row { display: flex; flex-direction: row; justify-content: center; column-gap: 20px; margin-top: 8px; }
  .btn {
    width: 120px;
    height: 44px;
    border: none;
    cursor: pointer;
    background-image: url("Asset/panel_bg.png");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    font-size: 18px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }

  /* ===== TipPanel overlay ===== */
  .tip-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    display: none;
    z-index: 100;
  }
  .tip-panel {
    width: 360px;
    padding: 30px 25px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    row-gap: 16px;
    background: rgba(20, 20, 35, 0.9);
    border: 2px solid rgba(255, 215, 0, 0.3);
    border-radius: 10px;
  }
  .tip-title { font-size: 18px; font-weight: bold; color: #ffd700; }
  .tip-info { font-size: 15px; color: #ddd; text-align: center; }
  .tip-btn {
    width: 100px;
    height: 38px;
    border: none;
    cursor: pointer;
    background-image: url("Asset/panel_bg.png");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    color: #fff;
    font-size: 15px;
  }
</style>
</head>
<body>

<div class="bevy-ui-root game-stage">

  <!-- LoginBKPanel -->
  <div class="login-bk" id="login_bk">
    <img src="Asset/BK.png" alt="background" />
  </div>

  <!-- LoginPanel -->
  <div class="login-panel" id="login_panel">

    <!-- txtUN + imgUN + inputUN -->
    <div class="form-row">
      <span class="form-label">账号:</span>
      <div class="input-wrapper" id="imgUN">
        <input type="text" id="inputUN" placeholder="请输入账号"
               data-binding="login.username"
               data-action-focus="login.un.focus"
               data-action-blur="login.un.blur" />
      </div>
    </div>

    <!-- txtPW + imgPW + inputPW -->
    <div class="form-row">
      <span class="form-label">密码:</span>
      <div class="input-wrapper" id="imgPW">
        <input type="password" id="inputPW" placeholder="请输入密码"
               data-binding="login.password" />
      </div>
    </div>

    <!-- togPW + togAuto: data-binding + data-action-change on input, larger size for click -->
    <div class="toggle-row">
      <label class="toggle" id="togPW">
        <input type="checkbox" data-binding="login.rememberPw"
               data-action-change="login.toggleRemember" />
        <span class="toggle-label">记住密码</span>
      </label>
      <label class="toggle" id="togAuto">
        <input type="checkbox" data-binding="login.autoLogin"
               data-action-change="login.toggleAuto" />
        <span class="toggle-label">自动登录</span>
      </label>
    </div>

    <!-- btnSure + btnRe -->
    <div class="button-row">
      <button class="btn" id="btnSure" data-action="login.sure">登录</button>
      <button class="btn" id="btnRe" data-action="login.register">注册</button>
    </div>
  </div>

  <!-- TipPanel -->
  <div class="tip-overlay" id="tip_panel">
    <div class="tip-panel">
      <div class="tip-title" id="txtTip">提示</div>
      <span class="tip-info" id="txtInfo" data-binding="tip.info">提示内容</span>
      <button class="tip-btn" id="btnTipSure" data-action="tip.close">确定</button>
    </div>
  </div>

  <!-- Static Action DSL -->
  <script type="application/json" data-bui-actions>
  {
    "actions": {
      "login.sure": [],
      "login.register": [],
      "tip.close": [
        { "op": "set-visible", "target": "tip_panel", "value": "hidden" }
      ],
      "login.toggleRemember": [],
      "login.toggleAuto": []
    }
  }
  </script>

  <!-- Browser preview JS (Bevy runtime uses ECS handlers instead) -->
  <script>
    (function() {
      var inputUN = document.getElementById('inputUN');
      var inputPW = document.getElementById('inputPW');
      var togPW = document.querySelector('#togPW input[type=checkbox]');
      var togAuto = document.querySelector('#togAuto input[type=checkbox]');
      var tipPanel = document.getElementById('tip_panel');
      var txtInfo = document.getElementById('txtInfo');

      function showTip(msg) { txtInfo.textContent = msg; tipPanel.style.visibility = 'visible'; }
      function hideTip() { tipPanel.style.visibility = 'hidden'; }

      document.getElementById('btnSure').addEventListener('click', function() {
        var un = inputUN.value.trim(), pw = inputPW.value.trim();
        if (un.length <= 6 || pw.length <= 6) { showTip('账号和密码都必须大于6位'); return; }
        showTip('登录成功！正在跳转...');
        setTimeout(function() { window.location.href = 'server_select.html'; }, 1000);
      });

      document.getElementById('btnRe').addEventListener('click', function() {
        window.location.href = 'register.html';
      });

      document.getElementById('btnTipSure').addEventListener('click', hideTip);

      togPW.addEventListener('change', function() { if (!this.checked) togAuto.checked = false; });
      togAuto.addEventListener('change', function() { if (this.checked) togPW.checked = true; });

      var saved = JSON.parse(localStorage.getItem('loginData') || '{}');
      if (saved.userName) inputUN.value = saved.userName;
      if (saved.rememberPw && saved.passWord) inputPW.value = saved.passWord;
      if (saved.rememberPw) togPW.checked = true;
      if (saved.autoLogin) togAuto.checked = true;

      if (togAuto.checked && inputUN.value && inputPW.value) {
        showTip('自动登录中...');
        setTimeout(function() { window.location.href = 'server_select.html'; }, 1000);
      }
    })();
  </script>
</div>

</body>
</html>
