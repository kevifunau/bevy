<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1365, initial-scale=1.0" />
<title>选择服务器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "Heiti SC", sans-serif; background: #1a1a2e; color: #fff; }
  .game-stage { width: 1365px; height: 768px; position: relative; margin: 0 auto; overflow: hidden; }

  .login-bk { position: absolute; inset: 0; overflow: hidden; }
  .login-bk img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }

  .server-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 900px; height: 540px;
    display: flex; flex-direction: column;
    background-image: url("Asset/panel_frame.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    padding: 15px;
  }
  .server-bg {
    position: absolute; inset: 15px;
    background-image: url("Asset/dark_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    z-index: 0;
  }
  .server-title {
    position: relative; z-index: 1;
    height: 40px;
    background-image: url("Asset/choose_server_title.png");
    background-repeat: no-repeat; background-position: center;
    background-size: auto 100%;
  }
  .decoration {
    position: absolute; top: 5px; right: 10px; width: 40px; height: 40px;
    background-image: url("Asset/decoration.png");
    background-repeat: no-repeat; background-size: contain;
    z-index: 2;
  }

  .server-content {
    position: relative; z-index: 1;
    flex: 1; display: flex; flex-direction: row;
    column-gap: 10px; padding: 10px 0;
  }

  .sv-left {
    width: 200px; display: flex; flex-direction: column;
    background-image: url("Asset/server_list_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    padding: 8px;
  }
  .sv-left-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; row-gap: 4px; }
  .left-item {
    height: 40px; display: flex; align-items: center; justify-content: center;
    background-image: url("Asset/server_select_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    cursor: pointer; transition: transform 0.1s;
  }
  .left-item:active { transform: scale(0.96); }
  .left-item-text { font-size: 14px; color: #ccc; }
  .left-item.active .left-item-text { color: #ffd700; }

  .sv-right {
    flex: 1; display: flex; flex-direction: column;
    background-image: url("Asset/server_list_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    padding: 8px;
  }
  .sv-right-content {
    flex: 1; overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, 295px);
    grid-auto-rows: 78px;
    column-gap: 9px; row-gap: 2px;
    justify-content: start; align-content: start;
  }
  .right-item {
    position: relative;
    display: flex; flex-direction: row; align-items: center;
    padding: 0 15px;
    background-image: url("Asset/server_list_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    cursor: pointer; transition: transform 0.1s; column-gap: 8px;
  }
  .right-item:active { transform: scale(0.96); }
  .right-item.selected { border: 2px solid #ffd700; border-radius: 4px; }
  .right-item-name { font-size: 15px; color: #ddd; flex: 1; }
  .right-item-state { width: 30px; height: 18px; background-repeat: no-repeat; background-size: contain; }
  .right-item-state.state-1 { background-image: url("Asset/status_smooth.png"); }
  .right-item-state.state-2 { background-image: url("Asset/status_busy.png"); }
  .right-item-state.state-3 { background-image: url("Asset/status_hot.png"); }
  .right-item-state.state-4 { background-image: url("Asset/status_maintenance.png"); }
  .right-item-new {
    position: absolute; top: -2px; right: -2px;
    width: 24px; height: 14px;
    background-image: url("Asset/new_tag.png");
    background-repeat: no-repeat; background-size: contain;
    display: none;
  }
  .right-item-new.show { display: block; }

  .server-bottom {
    position: relative; z-index: 1;
    height: 50px;
    display: flex; flex-direction: row; align-items: center; justify-content: space-between;
    padding: 0 10px;
  }
  .last-login { display: flex; flex-direction: row; align-items: center; column-gap: 8px; }
  .last-login-icon {
    width: 80px; height: 20px;
    background-image: url("Asset/last_login.png");
    background-repeat: no-repeat; background-size: contain;
  }
  .last-login-text { font-size: 14px; color: #ccc; }
  .last-login-text .server-name { color: #ffd700; }
  .last-login-state { width: 30px; height: 18px; background-repeat: no-repeat; background-size: contain; display: none; }
  .last-login-state.state-1 { background-image: url("Asset/status_smooth.png"); display: block; }
  .last-login-state.state-2 { background-image: url("Asset/status_busy.png"); display: block; }
  .last-login-state.state-3 { background-image: url("Asset/status_hot.png"); display: block; }
  .last-login-state.state-4 { background-image: url("Asset/status_maintenance.png"); display: block; }
  .server-range { font-size: 13px; color: rgba(255,255,255,0.5); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body>

<div class="bevy-ui-root game-stage">

  <div class="login-bk" id="login_bk">
    <img src="Asset/BK.png" alt="background" />
  </div>

  <div class="server-panel" id="choose_server_panel">
    <div class="server-bg"></div>
    <div class="server-title"></div>
    <div class="decoration"></div>

    <div class="server-content">
      <div class="sv-left" id="svLeft">
        <div class="sv-left-content" id="left_content"></div>
      </div>
      <div class="sv-right" id="svRight">
        <div class="sv-right-content" id="right_content"></div>
      </div>
    </div>

    <div class="server-bottom">
      <div class="last-login">
        <div class="last-login-icon"></div>
        <span class="last-login-text">上次登录：<span class="server-name" id="txtFront">无</span></span>
        <div class="last-login-state" id="lastLoginState"></div>
      </div>
      <span class="server-range" id="txtRange">服务器列表</span>
    </div>
  </div>

  <script type="application/json" data-bui-actions>
  {
    "actions": {
      "server.selectRegion": [],
      "server.selectServer": []
    }
  }
  </script>

  <script>
    (function() {
      var leftContent = document.getElementById('left_content');
      var rightContent = document.getElementById('right_content');
      var txtFront = document.getElementById('txtFront');
      var txtRange = document.getElementById('txtRange');
      var lastLoginState = document.getElementById('lastLoginState');

      var serverData = [
        {"id":1,"name":"天下无双","state":0,"isNew":false},
        {"id":2,"name":"无双霸业","state":1,"isNew":false},
        {"id":3,"name":"天下无敌","state":2,"isNew":false},
        {"id":4,"name":"哈哈哈哈","state":3,"isNew":false},
        {"id":5,"name":"黑恶阿斯","state":4,"isNew":false},
        {"id":6,"name":"上的重新","state":0,"isNew":false},
        {"id":7,"name":"的地方人","state":1,"isNew":false},
        {"id":8,"name":"而提供给","state":2,"isNew":false},
        {"id":9,"name":"天下无双1","state":3,"isNew":false},
        {"id":10,"name":"天下无双2","state":4,"isNew":false},
        {"id":11,"name":"天下无双3","state":0,"isNew":false},
        {"id":12,"name":"天下无双4","state":1,"isNew":false},
        {"id":13,"name":"天下无双5","state":2,"isNew":false},
        {"id":14,"name":"天下无双6","state":3,"isNew":false},
        {"id":15,"name":"天下无双7","state":4,"isNew":false},
        {"id":16,"name":"天下无双8","state":0,"isNew":false},
        {"id":17,"name":"天下无双9","state":1,"isNew":false},
        {"id":18,"name":"天下无双10","state":2,"isNew":false},
        {"id":19,"name":"天下无双11","state":3,"isNew":false},
        {"id":20,"name":"天下无双12","state":4,"isNew":false},
        {"id":21,"name":"天下无双13","state":0,"isNew":false},
        {"id":22,"name":"天下无双14","state":1,"isNew":false},
        {"id":23,"name":"天下无双15","state":2,"isNew":false},
        {"id":24,"name":"天下无双16","state":3,"isNew":false},
        {"id":25,"name":"天下无双17","state":4,"isNew":true},
        {"id":26,"name":"天下无双18","state":4,"isNew":true}
      ];

      var numGroups = Math.floor(serverData.length / 5) + 1;
      for (var i = 0; i < numGroups; i++) {
        var begin = i * 5 + 1;
        var end = Math.min(5 * (i + 1), serverData.length);
        if (begin > serverData.length) break;
        var item = document.createElement('div');
        item.className = 'left-item' + (i === 0 ? ' active' : '');
        item.innerHTML = '<span class="left-item-text">' + begin + ' - ' + end + '区</span>';
        (function(b, e, el) {
          el.addEventListener('click', function() {
            var prev = leftContent.querySelector('.left-item.active');
            if (prev) prev.classList.remove('active');
            el.classList.add('active');
            updatePanel(b, e);
          });
        })(begin, end, item);
        leftContent.appendChild(item);
      }

      function updatePanel(beginIndex, endIndex) {
        txtRange.textContent = '服务器 ' + beginIndex + '-' + endIndex;
        rightContent.innerHTML = '';
        for (var i = beginIndex; i <= endIndex; i++) {
          var info = serverData[i - 1];
          var item = document.createElement('div');
          item.className = 'right-item';
          var html = '<span class="right-item-name">' + info.id + '区  ' + info.name + '</span>';
          if (info.state > 0) html += '<div class="right-item-state state-' + info.state + '"></div>';
          if (info.isNew) html += '<div class="right-item-new show"></div>';
          item.innerHTML = html;
          (function(serverInfo, el) {
            el.addEventListener('click', function() {
              var prev = rightContent.querySelector('.right-item.selected');
              if (prev) prev.classList.remove('selected');
              el.classList.add('selected');
              var loginData = JSON.parse(localStorage.getItem('loginData') || '{}');
              loginData.frontServerID = serverInfo.id;
              loginData.frontServerName = serverInfo.id + '区 ' + serverInfo.name;
              localStorage.setItem('loginData', JSON.stringify(loginData));
              window.location.href = 'server_list.html';
            });
          })(info, item);
          rightContent.appendChild(item);
        }
      }

      var loginData = JSON.parse(localStorage.getItem('loginData') || '{}');
      if (loginData.frontServerID && loginData.frontServerID > 0) {
        var info = serverData[loginData.frontServerID - 1];
        txtFront.textContent = info.id + '区  ' + info.name;
        if (info.state > 0) lastLoginState.className = 'last-login-state state-' + info.state;
      }
      updatePanel(1, Math.min(5, serverData.length));
    })();
  </script>
</div>

</body>
</html>
