<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1365, initial-scale=1.0" />
<title>用户注册</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "Heiti SC", sans-serif; background: #1a1a2e; color: #fff; }

  .game-stage { width: 1365px; height: 768px; position: relative; margin: 0 auto; overflow: hidden; }

  .login-bk { position: absolute; inset: 0; overflow: hidden; }
  .login-bk img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

  .register-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 460px; padding: 40px 50px 35px;
    display: flex; flex-direction: column; align-items: stretch; row-gap: 18px;
    background: rgba(20, 20, 35, 0.85);
    border: 2px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
  }

  .register-title { text-align: center; font-size: 24px; font-weight: bold; color: #ffd700; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

  .form-row { display: flex; flex-direction: column; row-gap: 6px; }
  .form-label { font-size: 14px; color: #ccc; padding-left: 4px; }
  .input-wrapper {
    height: 42px;
    background-image: url("Asset/input_frame.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    display: flex; align-items: center; padding: 0 12px;
  }
  .input-wrapper input { width: 100%; height: 100%; border: none; background: transparent; color: #fff; font-size: 16px; outline: none; }
  .input-wrapper input::placeholder { color: #888; }

  .button-row { display: flex; flex-direction: row; justify-content: center; column-gap: 20px; margin-top: 8px; }
  .btn {
    width: 120px; height: 44px; border: none; cursor: pointer;
    background-image: url("Asset/panel_bg.png");
    background-repeat: no-repeat; background-size: 100% 100%;
    font-size: 18px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.96); }

  .tip-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; visibility: hidden; z-index: 100; }
  .tip-panel {
    width: 340px; padding: 30px 25px 20px;
    display: flex; flex-direction: column; align-items: center; row-gap: 16px;
    background: rgba(20, 20, 35, 0.9);
    border: 2px solid rgba(255, 215, 0, 0.3);
    border-radius: 10px;
  }
  .tip-title { font-size: 18px; font-weight: bold; color: #ffd700; }
  .tip-info { font-size: 15px; color: #ddd; text-align: center; }
</style>
</head>
<body>

<div class="bevy-ui-root game-stage">

  <div class="login-bk" id="login_bk">
    <img src="Asset/BK.png" alt="background" />
  </div>

  <div class="register-panel" id="register_panel">
    <div class="register-title">用户注册</div>

    <div class="form-row">
      <span class="form-label">账号:</span>
      <div class="input-wrapper" id="imgUN">
        <input type="text" id="inputUN" placeholder="请输入账号" data-binding="register.username" />
      </div>
    </div>

    <div class="form-row">
      <span class="form-label">密码:</span>
      <div class="input-wrapper" id="imgPW">
        <input type="password" id="inputPW" placeholder="请输入密码" data-binding="register.password" />
      </div>
    </div>

    <div class="button-row">
      <button class="btn" id="btnSure" data-action="register.sure">确定</button>
      <button class="btn" id="btnCancel" data-action="register.cancel">取消</button>
    </div>
  </div>

  <div class="tip-overlay" id="tip_panel">
    <div class="tip-panel">
      <div class="tip-title">提示</div>
      <div class="tip-info" id="txtInfo"></div>
      <button class="btn" id="btnTipSure" data-action="tip.close" style="width:100px;height:38px;font-size:15px;">确定</button>
    </div>
  </div>

  <script type="application/json" data-bui-actions>
  {
    "actions": {
      "register.sure": [],
      "register.cancel": [],
      "tip.close": [
        { "op": "set-visible", "target": "tip_panel", "value": "hidden" }
      ]
    }
  }
  </script>

  <script>
    (function() {
      var inputUN = document.getElementById('inputUN');
      var inputPW = document.getElementById('inputPW');
      var tipPanel = document.getElementById('tip_panel');
      var txtInfo = document.getElementById('txtInfo');

      function showTip(msg) { txtInfo.textContent = msg; tipPanel.style.visibility = 'visible'; }
      function hideTip() { tipPanel.style.visibility = 'hidden'; }

      document.getElementById('btnSure').addEventListener('click', function() {
        var un = inputUN.value.trim(), pw = inputPW.value.trim();
        if (un.length <= 6) { showTip('账号必须大于6位'); return; }
        if (pw.length <= 6) { showTip('密码必须大于6位'); return; }
        var users = JSON.parse(localStorage.getItem('users') || '{}');
        users[un] = pw;
        localStorage.setItem('users', JSON.stringify(users));
        showTip('注册成功！');
        setTimeout(function() {
          var loginData = JSON.parse(localStorage.getItem('loginData') || '{}');
          loginData.userName = un;
          localStorage.setItem('loginData', JSON.stringify(loginData));
          window.location.href = 'index.html';
        }, 1000);
      });

      document.getElementById('btnCancel').addEventListener('click', function() {
        window.location.href = 'index.html';
      });

      document.getElementById('btnTipSure').addEventListener('click', hideTip);
    })();
  </script>
</div>

</body>
</html>
