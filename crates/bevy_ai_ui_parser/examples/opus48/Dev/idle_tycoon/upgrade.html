<!DOCTYPE html>

<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --bg0: #211711;
  --bg1: #2E2018;
  --panel: #3A2A1E;
  --panel2: #4A372A;
  --line: #5E4634;
  --gold: #FFC247;
  --gold-d: #D9941C;
  --emerald: #4FD98A;
  --emerald-d: #28A862;
  --wood: #C98A4B;
  --text: #F5ECE0;
  --text-dim: #B79C82;
  --blue: #5BB8FF;
  --red: #FF6B5A;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 64px 48px;
  flex-direction: column;
}

/* ---------- topbar ---------- */
.topbar { flex-direction: row; align-items: center; height: 100px; margin-bottom: 40px; }
.back {
  width: 88px; height: 88px;
  background-color: var(--panel);
  border-radius: 26px;
  border-width: 3px; border-color: var(--line);
  align-items: center; justify-content: center; margin-right: 28px;
}
.titles { flex-direction: column; justify-content: center; flex-grow: 1; }
.title { font-size: 56px; color: var(--gold); font-weight: bold; white-space: normal; }
.subtitle { font-size: 28px; min-height: 34px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 2px; }

/* ---------- hero stat card ---------- */
.hero-card {
  flex-direction: row; align-items: center;
  background-color: var(--bg1);
  border-radius: 36px;
  border-width: 3px; border-color: var(--gold);
  padding: 36px 40px;
  margin-bottom: 40px;
}
.hero-medal {
  width: 132px; height: 132px;
  background-color: var(--panel);
  border-radius: 36px;
  border-width: 4px; border-color: var(--gold-d);
  align-items: center; justify-content: center;
  margin-right: 32px;
}
.hero-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.hero-lbl { font-size: 28px; min-height: 34px; color: var(--text-dim); font-weight: bold; white-space: normal; }
.hero-lv { font-size: 64px; min-height: 76px; color: var(--text); font-weight: bold; white-space: normal; }
.hero-bonus { font-size: 32px; min-height: 40px; color: var(--emerald); font-weight: bold; white-space: normal; margin-top: 4px; }

/* ---------- upgrade list ---------- */
.sec-label { font-size: 30px; min-height: 38px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-bottom: 22px; }
.ups { flex-direction: column; flex-grow: 1; }
.up {
  flex-direction: row; align-items: center;
  height: 168px;
  background-color: var(--panel);
  border-radius: 30px;
  border-width: 3px; border-color: var(--line);
  padding: 0 28px;
  margin-bottom: 26px;
}
.up-ico {
  width: 104px; height: 104px;
  background-color: var(--bg1);
  border-radius: 26px;
  border-width: 3px; border-color: var(--wood);
  align-items: center; justify-content: center;
  margin-right: 26px;
}
.up-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.up-name { font-size: 38px; min-height: 46px; color: var(--text); font-weight: bold; white-space: normal; }
.up-eff { font-size: 27px; min-height: 34px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 4px; }
.up-eff-em { color: var(--emerald); }
.up-btn {
  flex-direction: column; align-items: center; justify-content: center;
  min-width: 200px; height: 116px;
  background-color: var(--gold);
  border-radius: 26px;
  border-width: 3px; border-color: var(--gold-d);
  padding: 0 20px;
}
.up-btn-cost { flex-direction: row; align-items: center; }
.up-btn-coin { width: 34px; height: 34px; margin-right: 10px; }
.up-btn-tx { font-size: 38px; min-height: 46px; color: #3A2400; font-weight: bold; white-space: normal; }
.up-btn-lbl { font-size: 22px; min-height: 28px; color: #6B4A10; font-weight: bold; white-space: normal; margin-top: 2px; }
.up-btn-lock { background-color: var(--panel2); border-color: var(--line); }
.up-btn-lock-tx { font-size: 30px; min-height: 38px; color: var(--text-dim); font-weight: bold; white-space: normal; }

/* ---------- bottom action ---------- */
.allup {
  flex-direction: row; align-items: center; justify-content: center;
  height: 140px;
  background-color: var(--emerald);
  border-radius: 38px;
  border-width: 4px; border-color: var(--emerald-d);
  margin-top: 16px;
}
.allup-tx { font-size: 46px; min-height: 56px; color: #06291A; font-weight: bold; white-space: normal; }
</style>
