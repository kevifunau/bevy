<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --bg0: #0A0E1A;
  --bg1: #111733;
  --panel: #161D3D;
  --panel2: #1E2750;
  --cyan: #22E6E6;
  --magenta: #FF3DCB;
  --violet: #7C5CFF;
  --line: #2C376B;
  --text: #EAF2FF;
  --text-dim: #8FA0CC;
  --gold: #FFC857;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 96px 72px;
  flex-direction: column;
  align-items: center;
}

.result-head {
  flex-direction: column;
  align-items: center;
  margin-bottom: 64px;
}
.head-title {
  font-size: 88px;
  color: var(--magenta);
  font-weight: bold;
  white-space: normal;
  -unity-text-align: middle-center;
}
.head-sub {
  font-size: 30px;
  color: var(--text-dim);
  font-weight: bold;
  white-space: normal;
  margin-top: 12px;
}

/* ---------- score panel ---------- */
.score-panel {
  width: 100%;
  flex-direction: column;
  align-items: center;
  background-color: var(--bg1);
  border-radius: 56px;
  border-width: 4px;
  border-color: var(--cyan);
  padding: 72px 56px;
  margin-bottom: 56px;
}
.score-label { font-size: 32px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-bottom: 16px; }
.score-value { font-size: 168px; color: var(--cyan); font-weight: bold; white-space: normal; -unity-text-align: middle-center; }

.compare-row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 48px;
}
.compare-cell {
  flex-direction: column;
  align-items: center;
  flex-grow: 1;
}
.compare-divider { width: 3px; height: 96px; background-color: var(--line); margin: 0 32px; }
.cmp-label { flex-direction: row; align-items: center; margin-bottom: 12px; }
.cmp-ico { width: 36px; height: 36px; margin-right: 12px; }
.cmp-name { font-size: 26px; color: var(--text-dim); font-weight: bold; white-space: normal; }
.cmp-num { font-size: 56px; color: var(--gold); font-weight: bold; white-space: normal; }
.cmp-num-new { color: var(--magenta); }

/* ---------- reward ---------- */
.reward {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 160px;
  border-radius: 40px;
  background-color: var(--panel);
  border-width: 3px;
  border-color: var(--line);
  margin-bottom: 88px;
}
.reward-coin {
  width: 88px;
  height: 88px;
  border-radius: 24px;
  background-color: var(--panel2);
  align-items: center;
  justify-content: center;
  margin-right: 28px;
}
.reward-text { flex-direction: column; justify-content: center; }
.reward-top { font-size: 26px; color: var(--text-dim); font-weight: bold; white-space: normal; }
.reward-amount { font-size: 52px; color: var(--gold); font-weight: bold; white-space: normal; }

/* ---------- buttons ---------- */
.btn-col { flex-direction: column; align-items: center; flex-grow: 1; justify-content: flex-end; }
.btn-retry {
  width: 640px;
  height: 200px;
  border-radius: 56px;
  background-color: var(--magenta);
  border-width: 5px;
  border-color: #FF7ADB;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  margin-bottom: 36px;
}
.btn-retry-ico { width: 56px; height: 56px; margin-right: 24px; }
.btn-retry-text { font-size: 56px; color: #FFFFFF; font-weight: bold; white-space: normal; }
.btn-back {
  width: 640px;
  height: 140px;
  border-radius: 44px;
  background-color: var(--panel);
  border-width: 3px;
  border-color: var(--line);
  align-items: center;
  justify-content: center;
}
.btn-back-text { font-size: 40px; color: var(--text-dim); font-weight: bold; white-space: normal; }
</style>
</head>
<body>
  <div class="page">

    <div class="result-head">
      <span class="head-title">GAME OVER</span>
      <span class="head-sub">新纪录！节奏感满分</span>
    </div>

    <div class="score-panel">
      <span class="score-label">本局得分</span>
      <span class="score-value">31,205</span>

      <div class="compare-row">
        <div class="compare-cell">
          <div class="cmp-label">
            <svg id="icon-crown-old" class="cmp-ico" width="36" height="36" viewBox="0 0 36 36">
              <path d="M6 27 L6 13 L13 19 L18 9 L23 19 L30 13 L30 27 Z" fill="#FFC857" stroke="#E0A92F" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <span class="cmp-name">原最高</span>
          </div>
          <span class="cmp-num">28,640</span>
        </div>
        <div class="compare-divider"></div>
        <div class="compare-cell">
          <div class="cmp-label">
            <svg id="icon-spark" class="cmp-ico" width="36" height="36" viewBox="0 0 36 36">
              <path d="M18 4 L21 15 L32 18 L21 21 L18 32 L15 21 L4 18 L15 15 Z" fill="#FF3DCB"/>
            </svg>
            <span class="cmp-name">本局</span>
          </div>
          <span class="cmp-num cmp-num-new">31,205</span>
        </div>
      </div>
    </div>

    <div class="reward">
      <div class="reward-coin">
        <svg id="icon-coin" width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="22" fill="#FFD54F" stroke="#E0A92F" stroke-width="4"/>
          <circle cx="28" cy="28" r="12" fill="#FFE9A8"/>
          <path d="M28 18 L28 38 M22 22 L34 34" stroke="#E0A92F" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="reward-text">
        <span class="reward-top">获得奖励</span>
        <span class="reward-amount">+ 312</span>
      </div>
    </div>

    <div class="btn-col">
      <div class="btn-retry">
        <svg id="icon-retry" class="btn-retry-ico" width="56" height="56" viewBox="0 0 56 56">
          <path d="M12 28 A16 16 0 1 1 17 39" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M9 16 L12 30 L25 27" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn-retry-text">再来一局</span>
      </div>
      <div class="btn-back">
        <span class="btn-back-text">返回主页</span>
      </div>
    </div>

  </div>
</body>
</html>
