<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --bg0: #0A0E1A;
  --bg1: #111733;
  --panel: #161D3D;
  --panel2: #1E2750;
  --cyan: #22E6E6;
  --magenta: #FF3DCB;
  --violet: #7C5CFF;
  --line: #2C376B;
  --text: #EAF2FF;
  --text-dim: #8FA0CC;
  --gold: #FFC857;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 96px 72px;
  flex-direction: column;
  align-items: center;
}

/* ---------- top mini bar ---------- */
.topbar {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 96px;
}
.icon-btn {
  width: 96px;
  height: 96px;
  border-radius: 28px;
  background-color: var(--panel);
  border-width: 3px;
  border-color: var(--line);
  align-items: center;
  justify-content: center;
}
.icon-btn-cyan { border-color: var(--cyan); }
.icon-btn-magenta { border-color: var(--magenta); }

/* ---------- logo block ---------- */
.logo-zone {
  flex-direction: column;
  align-items: center;
  flex-grow: 1;
  justify-content: center;
}
.logo-orb {
  width: 360px;
  height: 360px;
  border-radius: 180px;
  background-color: var(--bg1);
  border-width: 8px;
  border-color: var(--cyan);
  align-items: center;
  justify-content: center;
  margin-bottom: 64px;
}
.logo-orb-inner {
  width: 240px;
  height: 240px;
  border-radius: 120px;
  background-color: var(--panel2);
  border-width: 6px;
  border-color: var(--magenta);
  align-items: center;
  justify-content: center;
}
.logo-title {
  font-size: 112px;
  color: var(--cyan);
  font-weight: bold;
  white-space: normal;
  -unity-text-align: middle-center;
}
.logo-sub {
  font-size: 30px;
  color: var(--magenta);
  font-weight: bold;
  white-space: normal;
  margin-top: 8px;
  -unity-text-align: middle-center;
}

/* ---------- best score chip ---------- */
.best-chip {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  height: 110px;
  border-radius: 28px;
  background-color: var(--panel);
  border-width: 3px;
  border-color: var(--line);
  padding: 0 44px;
  margin-bottom: 96px;
}
.best-ico { width: 48px; height: 48px; margin-right: 20px; }
.best-label { font-size: 28px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-right: 24px; }
.best-num { font-size: 48px; color: var(--gold); font-weight: bold; white-space: normal; }

/* ---------- play button ---------- */
.play-btn {
  width: 640px;
  height: 280px;
  border-radius: 64px;
  background-color: var(--cyan);
  border-width: 6px;
  border-color: #66FFF6;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 40px;
}
.play-text { font-size: 76px; color: var(--bg0); font-weight: bold; white-space: normal; }
.play-hint { font-size: 26px; color: var(--bg1); font-weight: bold; white-space: normal; margin-top: 6px; }

.tip { font-size: 26px; color: var(--text-dim); white-space: normal; -unity-text-align: middle-center; }
</style>
</head>
<body>
  <div class="page">

    <div class="topbar">
      <div class="icon-btn icon-btn-magenta">
        <svg id="icon-sound" width="48" height="48" viewBox="0 0 48 48">
          <path d="M10 18 L18 18 L28 9 L28 39 L18 30 L10 30 Z" fill="#FF3DCB"/>
          <path d="M34 16 L42 32 M42 16 L34 32" stroke="#FF3DCB" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon-btn icon-btn-cyan">
        <svg id="icon-rank" width="48" height="48" viewBox="0 0 48 48">
          <rect x="8" y="26" width="9" height="16" rx="2" fill="#22E6E6"/>
          <rect x="20" y="14" width="9" height="28" rx="2" fill="#22E6E6"/>
          <rect x="32" y="20" width="9" height="22" rx="2" fill="#22E6E6"/>
        </svg>
      </div>
    </div>

    <div class="logo-zone">
      <div class="logo-orb">
        <div class="logo-orb-inner">
          <svg id="icon-pulse" width="160" height="160" viewBox="0 0 160 160">
            <path d="M16 80 L52 80 L66 36 L92 124 L108 80 L144 80" stroke="#22E6E6" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <span class="logo-title">PULSE</span>
      <span class="logo-sub">TAP TO THE BEAT</span>
    </div>

    <div class="best-chip">
      <svg id="icon-crown" class="best-ico" width="48" height="48" viewBox="0 0 48 48">
        <path d="M8 36 L8 18 L18 26 L24 12 L30 26 L40 18 L40 36 Z" fill="#FFC857" stroke="#E0A92F" stroke-width="2" stroke-linejoin="round"/>
        <rect x="8" y="36" width="32" height="6" rx="2" fill="#E0A92F"/>
      </svg>
      <span class="best-label">最高分</span>
      <span class="best-num">28,640</span>
    </div>

    <div class="play-btn">
      <span class="play-text">开始</span>
      <span class="play-hint">TAP TO START</span>
    </div>

    <span class="tip">点击屏幕，跟随节拍得分</span>

  </div>
</body>
</html>
