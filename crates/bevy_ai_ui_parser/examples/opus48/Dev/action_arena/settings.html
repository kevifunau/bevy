<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }

<style>
:root {

/* ---------- main two columns ---------- */
.main { flex-direction: row; flex-grow: 1; }
.col { flex-direction: column; flex-grow: 1; }
.col-first { margin-right: 36px; }

.sec-label { flex-direction: row; align-items: center; height: 44px; margin-bottom: 20px; }
.sec-bar { width: 48px; height: 8px; background-color: var(--ember); margin-right: 16px; }

.panel {

  background-color: var(--panel);
  border-width: 4px; border-color: var(--line);
  padding: 8px 36px;
  margin-bottom: 36px;
}
.row { flex-direction: row; align-items: center; height: 116px; }
.row-div { border-width: 0px; border-bottom-width: 2px; border-color: var(--line); }
.row-ico {
  width: 68px; height: 68px;
  background-color: var(--bg1);
  border-width: 2px; border-color: var(--line);

  margin-right: 28px;
}
.row-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.row-name { font-size: 34px; min-height: 42px; color: var(--text); font-weight: bold; white-space: normal; }
.row-sub { font-size: 22px; min-height: 28px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 4px; }

/* toggle (skinned) */
.toggle { width: 118px; height: 62px; flex-direction: row; align-items: center; }
.toggle-on { width: 118px; height: 62px; background-color: var(--blue-d); border-width: 3px; border-color: var(--blue); justify-content: flex-end; padding: 0 6px; }
.toggle-off { width: 118px; height: 62px; background-color: var(--bg1); border-width: 3px; border-color: var(--line); justify-content: flex-start; padding: 0 6px; }
.knob { width: 44px; height: 44px; background-color: var(--text); }

/* select value */
.row-val {
  flex-direction: row; align-items: center; justify-content: center;
  height: 62px;
  background-color: var(--bg1);
  border-width: 3px; border-color: var(--line);
  padding: 0 24px;
}
.row-val-tx { font-size: 28px; min-height: 34px; color: var(--blue); font-weight: bold; white-space: normal; margin-right: 14px; }
.row-val-arr { width: 26px; height: 26px; }

/* quality segmented */
.seg { flex-direction: row; align-items: center; height: 62px; }
.seg-item {
  flex-direction: row; align-items: center; justify-content: center;

.seg-tx-on { font-size: 26px; min-height: 32px; color: #2A1003; font-weight: bold; white-space: normal; }

/* account card */

.logout-tx { font-size: 30px; min-height: 38px; color: var(--text); font-weight: bold; white-space: normal; }
</style>
