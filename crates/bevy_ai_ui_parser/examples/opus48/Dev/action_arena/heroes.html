<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
:root {
  --bg0: #0C111B;
  --bg1: #141C2B;
  --panel: #1B2536;
  --panel2: #243047;
  --line: #2E3D58;
  --ember: #FF6A2B;
  --ember-d: #C8420F;
  --blue: #38C6FF;
  --blue-d: #1A8FC4;
  --red: #FF3B4E;
  --gold: #FFC24B;
  --text: #E8EEFA;
  --text-dim: #7E8DAB;
  --green: #4BE08A;
  --purple: #A06BFF;
}

.page {
  width: 1920px;
  height: 1080px;
  background-color: var(--bg0);
  padding: 48px 56px;
  flex-direction: column;
}

/* ---------- topbar ---------- */
.topbar { flex-direction: row; align-items: center; height: 80px; margin-bottom: 32px; }
.back {
  width: 72px; height: 72px;
  background-color: var(--panel);
  border-width: 3px; border-color: var(--line);
  align-items: center; justify-content: center; margin-right: 24px;
}
.title { font-size: 48px; color: var(--text); font-weight: bold; white-space: normal; flex-grow: 1; }
.power-chip {
  flex-direction: row; align-items: center;
  height: 68px;
  background-color: var(--panel);
  border-width: 3px; border-color: var(--ember);
  padding: 0 26px 0 14px;
}
.power-chip-ico { width: 40px; height: 40px; margin-right: 12px; }
.power-chip-tx { font-size: 32px; min-height: 40px; color: var(--ember); font-weight: bold; white-space: normal; }

/* ---------- main row ---------- */
.main { flex-direction: row; flex-grow: 1; }

/* hero showcase */
.showcase {
  width: 760px;
  background-color: var(--bg1);
  border-width: 4px; border-color: var(--line);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  margin-right: 36px;
}
.hero-figure {
  width: 360px; height: 440px;
  background-color: var(--panel2);
  border-width: 5px; border-color: var(--blue);
  align-items: center; justify-content: center;
  margin-bottom: 28px;
}
.hero-name { font-size: 60px; color: var(--blue); font-weight: bold; white-space: normal; }
.hero-class { font-size: 30px; min-height: 38px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 8px; }
.hero-stars { flex-direction: row; align-items: center; height: 48px; margin-top: 20px; }
.hstar { width: 44px; height: 44px; margin-right: 8px; }

/* attribute panel */
.attr {
  flex-grow: 1;
  flex-direction: column;
}
.attr-card {
  background-color: var(--panel);
  border-width: 4px; border-color: var(--line);
  padding: 32px 36px;
  flex-direction: column;
  margin-bottom: 28px;
}
.attr-title { font-size: 30px; min-height: 38px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-bottom: 24px; }
.attr-row { flex-direction: row; align-items: center; height: 72px; }
.attr-lbl { width: 180px; font-size: 30px; min-height: 38px; color: var(--text); font-weight: bold; white-space: normal; }
.attr-bar { flex-grow: 1; height: 24px; background-color: var(--bg0); margin-right: 24px; }
.attr-fill { height: 24px; }
.fill-red { background-color: var(--red); }
.fill-ember { background-color: var(--ember); }
.fill-blue { background-color: var(--blue); }
.fill-green { background-color: var(--green); }
.attr-num { width: 80px; font-size: 30px; min-height: 38px; color: var(--gold); font-weight: bold; white-space: normal; }

.skill-card {
  background-color: var(--panel);
  border-width: 4px; border-color: var(--line);
  padding: 28px 32px;
  flex-direction: row;
  align-items: center;
  flex-grow: 1;
}
.skill-ico {
  width: 100px; height: 100px;
  background-color: var(--ember-d);
  border-width: 3px; border-color: var(--ember);
  align-items: center; justify-content: center;
  margin-right: 28px;
}
.skill-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.skill-name { font-size: 38px; min-height: 46px; color: var(--ember); font-weight: bold; white-space: normal; }
.skill-desc { font-size: 26px; min-height: 32px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 6px; }

/* ---------- bottom hero list ---------- */
.hlist { flex-direction: row; align-items: center; height: 168px; margin-top: 32px; }
.hslot {
  width: 168px; height: 168px;
  background-color: var(--panel);
  border-width: 4px; border-color: var(--line);
  align-items: center; justify-content: center;
  margin-right: 28px;
}
.hslot.is-on { border-color: var(--blue); background-color: var(--panel2); }
.hslot.is-lock { background-color: var(--bg1); }
.hslot-ring {
  width: 96px; height: 96px;
  border-radius: 48px;
  align-items: center; justify-content: center;
}
.ring-blue { background-color: var(--blue-d); }
.ring-red { background-color: #8E2230; }
.ring-purple { background-color: #5A3AA0; }
.ring-green { background-color: #2A7A4E; }
.ring-lock { background-color: var(--bg0); }
</style>
</head>
