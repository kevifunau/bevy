<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的

 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
:root {
  --bg0: #2A1B5E;
  --bg1: #4A2D9C;
  --card: #FFFFFF;
  --card-soft: #F3EEFF;
  --purple: #9B6BFF;

  --teal: #3FD9C4;

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 80px 64px;
  flex-direction: column;

}

/* ---------- top resource bar ---------- */
.res-bar { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; height: 100px; margin-bottom: 60px; }
.res-chip {
  flex-direction: row; align-items: center;

  background-color: var(--bg1);

  padding: 0 32px 0 14px;
}
.res-ico { width: 60px; height: 60px; margin-right: 14px; }
.res-tx { font-size: 40px; min-height: 48px; color: var(--gold); font-weight: bold; white-space: normal; }
.res-tx-teal { color: var(--teal); }
.res-gap { width: 28px; }
.avatar {
  width: 96px; height: 96px;
  background-color: var(--pink);
  border-radius: 48px;
  border-width: 5px; border-color: var(--pink-d);
  align-items: center; justify-content: center;
}

/* ---------- logo ---------- */
.logo-wrap { flex-direction: column; align-items: center; margin-bottom: 36px; }
.crest {
  width: 220px; height: 220px;
  background-color: var(--bg1);
  border-radius: 60px;
  border-width: 8px; border-color: var(--teal);
  align-items: center; justify-content: center;
  margin-bottom: 32px;
}
.logo-l1 { font-size: 132px; color: var(--gold); font-weight: bold; white-space: normal; }
.logo-l2 { font-size: 92px; color: var(--teal); font-weight: bold; white-space: normal; margin-top: -8px; }
.logo-sub {
  flex-direction: row; align-items: center;
  height: 64px;
  background-color: var(--bg1);
  border-radius: 32px;
  padding: 0 36px;
  margin-top: 28px;
}
.logo-sub-tx { font-size: 32px; min-height: 40px; color: var(--white-dim); font-weight: bold; white-space: normal; }

/* ---------- menu buttons ---------- */
.menu { flex-direction: column; align-items: center; align-self: stretch; flex-grow: 1; justify-content: center; }
.mbtn {
  flex-direction: row; align-items: center;
  width: 760px; height: 168px;
  border-radius: 52px;
  border-width: 0px;
  padding: 0 48px;

}
.mbtn-start { background-color: var(--gold); border-width: 6px; border-color: var(--gold-d); }
.mbtn-hero { background-color: var(--purple); border-width: 6px; border-color: var(--purple-d); }
.mbtn-set { background-color: var(--teal); border-width: 6px; border-color: var(--teal-d); margin-bottom: 0; }
.mbtn-ico {

  align-items: center; justify-content: center;
  margin-right: 36px;

.mbtn-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.mbtn-tx { font-size: 56px; font-weight: bold; white-space: normal; }

.mbtn-arr { width: 48px; height: 48px; }

.footer { flex-direction: row; align-items: center; justify-content: center; height: 48px; margin-top: 48px; }
.footer-tx { font-size: 26px; min-height: 32px; color: var(--ink-dim); font-weight: bold; white-space: normal; }
</style>
