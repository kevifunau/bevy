<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
:root {
  --bg0: #2A1B5E;
  --bg1: #4A2D9C;
  --card: #FFFFFF;
  --card-soft: #F3EEFF;
  --purple: #9B6BFF;
  --purple-d: #6E3FE0;
  --teal: #3FD9C4;
  --teal-d: #1FB6A2;
  --pink: #FF8FC8;
  --pink-d: #E85AA6;
  --gold: #FFC94D;
  --gold-d: #F0A521;
  --ink: #3A2B66;
  --ink-dim: #9B8FC4;
  --white-dim: #D9CEFF;
  --lock: #6B5B9E;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 72px 56px;
  flex-direction: column;
}

/* ---------- topbar ---------- */
.topbar { flex-direction: row; align-items: center; height: 110px; margin-bottom: 40px; }
.back {
  width: 96px; height: 96px;
  background-color: var(--bg1);
  border-radius: 32px;
  border-width: 4px; border-color: var(--purple);
  align-items: center; justify-content: center; margin-right: 28px;
}
.titles { flex-direction: column; justify-content: center; flex-grow: 1; }
.title { font-size: 60px; color: var(--gold); font-weight: bold; white-space: normal; }
.subtitle { font-size: 28px; min-height: 34px; color: var(--white-dim); font-weight: bold; white-space: normal; }
.star-chip {
  flex-direction: row; align-items: center;
  height: 80px;
  background-color: var(--bg1);
  border-radius: 40px;
  border-width: 4px; border-color: var(--gold);
  padding: 0 30px 0 16px;
}
.star-chip-ico { width: 48px; height: 48px; margin-right: 12px; }
.star-chip-tx { font-size: 36px; min-height: 44px; color: var(--gold); font-weight: bold; white-space: normal; }

/* ---------- chapter tabs ---------- */
.chaps { flex-direction: row; align-items: center; margin-bottom: 36px; }
.chap {
  flex-direction: row; align-items: center; justify-content: center;
  height: 76px;
  background-color: var(--bg1);
  border-radius: 38px;
  padding: 0 36px; margin-right: 22px;
}
.chap.is-on { background-color: var(--teal); }
.chap-tx { font-size: 30px; min-height: 36px; color: var(--white-dim); font-weight: bold; white-space: normal; }
.chap.is-on .chap-tx { color: #0C3A33; }

/* ---------- level grid ---------- */
.grid { flex-direction: column; flex-grow: 1; }
.grow { flex-direction: row; margin-bottom: 36px; }
.lv-card {
  width: 460px; height: 380px;
  background-color: var(--card);
  border-radius: 48px;
  flex-direction: column;
  align-items: center;
  padding: 36px 24px;
}
.lv-card-first { margin-right: 48px; }
.lv-card.is-cur { border-width: 6px; border-color: var(--teal); }
.lv-card.is-lock { background-color: var(--bg1); }

.lv-badge {
  width: 132px; height: 132px;
  border-radius: 40px;
  align-items: center; justify-content: center;
  margin-bottom: 22px;
}
.lv-badge-done { width: 132px; height: 132px; background-color: var(--card-soft); }
.lv-badge-cur { width: 132px; height: 132px; background-color: var(--teal); }
.lv-badge-lock { width: 132px; height: 132px; background-color: #38256E; }
.lv-num { font-size: 72px; font-weight: bold; white-space: normal; }
.lv-num-done { color: var(--purple); }
.lv-num-cur { color: #FFFFFF; }

.lv-name { font-size: 34px; min-height: 42px; color: var(--ink); font-weight: bold; white-space: normal; margin-bottom: 18px; }
.lv-name-lock { color: var(--white-dim); }

.lv-stars { flex-direction: row; align-items: center; height: 48px; }
.lv-star { width: 44px; height: 44px; margin-right: 10px; }
.lv-star-last { margin-right: 0; }
.lv-lock-row { flex-direction: row; align-items: center; height: 48px; }
.lv-lock-ico { width: 40px; height: 40px; margin-right: 12px; }
.lv-lock-tx { font-size: 28px; min-height: 34px; color: var(--lock); font-weight: bold; white-space: normal; }
</style>
