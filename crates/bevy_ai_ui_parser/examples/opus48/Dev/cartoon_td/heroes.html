*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;

  min-height: 0;

.count-tx { font-size: 36px; min-height: 44px; color: var(--purple); font-weight: bold; white-space: normal; }

/* ---------- featured hero ---------- */
.feature {

.feat-tag-tx { font-size: 26px; min-height: 32px; color: var(--teal); font-weight: bold; white-space: normal; }

.crow { flex-direction: row; margin-bottom: 32px; }
