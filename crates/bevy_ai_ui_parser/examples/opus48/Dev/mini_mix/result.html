<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --cream: #FFF6EE;
  --cream2: #FFEFE2;
  --card: #FFFFFF;
  --pink: #FF9EC4;
  --pink-soft: #FFE2EE;
  --mint: #7FD6C2;
  --mint-soft: #DBF5EE;
  --lemon: #FFD479;
  --lemon-soft: #FFF0CE;
  --lilac: #B7A6F0;
  --ink: #6B5B73;
  --ink-dim: #A99CB0;
  --line: #F2E4DA;
  --gold: #F4A93C;
  --track: #EFE6DD;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--cream);
  padding: 88px 72px;
  flex-direction: column;
  align-items: center;
}

.win-badge {
  width: 240px;
  height: 240px;
  border-radius: 120px;
  background-color: var(--card);
  border-width: 8px;
  border-color: var(--mint);
  align-items: center;
  justify-content: center;
  margin-bottom: 36px;
}
.win-title { font-size: 72px; color: var(--ink); font-weight: bold; white-space: normal; -unity-text-align: middle-center; }
.win-game { font-size: 30px; color: var(--ink-dim); font-weight: bold; white-space: normal; margin-top: 8px; margin-bottom: 48px; }

/* ---------- stars ---------- */
.stars { flex-direction: row; align-items: center; justify-content: center; margin-bottom: 48px; }
.star-wrap { width: 132px; height: 132px; align-items: center; justify-content: center; margin-right: 20px; }
.star-wrap-last { margin-right: 0; }
.star-mid { width: 156px; height: 156px; }

/* ---------- score card ---------- */
.score-card {
  width: 100%;
  flex-direction: column;
  background-color: var(--card);
  border-radius: 48px;
  border-width: 4px;
  border-color: var(--line);
  padding: 48px 56px;
  margin-bottom: 36px;
}
.sc-row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  height: 96px;
}
.sc-row-div { border-color: var(--line); border-bottom-width: 2px; }
.sc-left { flex-direction: row; align-items: center; }
.sc-ico-wrap {
  width: 64px; height: 64px; border-radius: 18px;
  background-color: var(--pink-soft);
  align-items: center; justify-content: center; margin-right: 20px;
}
.sc-ico-wrap-mint { background-color: var(--mint-soft); }
.sc-name { font-size: 30px; color: var(--ink); font-weight: bold; white-space: normal; }
.sc-val { font-size: 40px; color: var(--gold); font-weight: bold; white-space: normal; }

/* ---------- reward ---------- */
.reward {
  width: 100%;
  flex-direction: row; align-items: center; justify-content: center;
  height: 140px; border-radius: 40px;
  background-color: var(--lemon-soft);
  border-width: 3px; border-color: var(--lemon);
  margin-bottom: 64px;
}
.reward-ico { width: 64px; height: 64px; margin-right: 20px; }
.reward-tx { font-size: 40px; color: var(--gold); font-weight: bold; white-space: normal; }

/* ---------- buttons ---------- */
.btns { flex-direction: column; align-items: center; flex-grow: 1; justify-content: flex-end; }
.btn-again {
  width: 720px; height: 180px; border-radius: 50px;
  background-color: var(--pink);
  border-width: 5px; border-color: #FFB8D4;
  flex-direction: row; align-items: center; justify-content: center;
  margin-bottom: 32px;
}
.btn-again-ico { width: 52px; height: 52px; margin-right: 20px; }
.btn-again-tx { font-size: 48px; color: #FFFFFF; font-weight: bold; white-space: normal; }
.btn-home {
  width: 720px; height: 140px; border-radius: 44px;
  background-color: var(--card);
  border-width: 3px; border-color: var(--line);
  align-items: center; justify-content: center;
}
.btn-home-tx { font-size: 40px; color: var(--ink-dim); font-weight: bold; white-space: normal; }
</style>
</head>
<body>
  <div class="page">
