<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --bg0: #16102E;
  --bg1: #1F1742;
  --panel: #2A1F58;
  --panel2: #362873;
  --line: #4A3A8C;
  --gold: #F2C14E;
  --gold-d: #C9971F;
  --rune: #B06BFF;
  --rune-d: #7E3FD6;
  --mana: #3FC8E8;
  --mana-d: #1E96B8;
  --text: #EDE8FF;
  --text-dim: #9486C4;
  --red: #FF5A6E;
  --green: #5BE0A0;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 40px 40px;
  flex-direction: column;
}

/* ---------- player headers ---------- */
.hero-row { flex-direction: row; align-items: center; height: 120px; }
.hero-portrait {
  width: 100px; height: 100px;
  border-radius: 50px;
  border-width: 4px;
  align-items: center; justify-content: center;
  margin-right: 20px;
}
.hp-enemy { background-color: #5A2230; border-color: var(--red); }
.hp-self { background-color: var(--mana-d); border-color: var(--mana); }
.hero-info { flex-direction: column; justify-content: center; flex-grow: 1; }
.hero-name { font-size: 32px; min-height: 40px; color: var(--text); font-weight: bold; white-space: normal; }
.hero-hp-track { flex-direction: row; align-items: center; height: 40px; margin-top: 8px; width: 320px; background-color: var(--bg1); border-radius: 20px; border-width: 2px; border-color: var(--line); }
.hero-hp-fill { height: 36px; border-radius: 18px; }
.fill-red { background-color: var(--red); }
.fill-green { background-color: var(--green); }
.hero-hp-tx { font-size: 36px; min-height: 44px; color: var(--text); font-weight: bold; white-space: normal; margin-left: 20px; }
.hp-ico { width: 40px; height: 40px; }

/* mana crystals */
.mana-row { flex-direction: row; align-items: center; justify-content: flex-end; height: 56px; margin-top: 10px; }
.crystal { width: 30px; height: 30px; margin-left: 8px; }

/* ---------- battlefield ---------- */
.field { flex-direction: column; flex-grow: 1; justify-content: center; }
.field-line {
  flex-direction: row; align-items: center; justify-content: center;
  height: 220px;
  margin-bottom: 24px;
}
.field-enemy { background-color: rgba(90,34,48,0.18); border-radius: 24px; }
.field-self { background-color: rgba(31,116,140,0.16); border-radius: 24px; }
.minion {
  width: 150px; height: 190px;
  background-color: var(--panel);
  border-radius: 20px;
  border-width: 3px; border-color: var(--line);
  flex-direction: column;
  align-items: center;
  padding: 10px;
  margin: 0 14px;
}
.minion-gold { border-color: var(--gold); }
.minion-rune { border-color: var(--rune); }
.minion-art {
  width: 110px; height: 96px;
  background-color: var(--bg1);
  border-radius: 14px;
  align-items: center; justify-content: center;
  margin-bottom: 8px;
}
.minion-stats { flex-direction: row; align-items: center; justify-content: space-between; width: 110px; height: 44px; }
.minion-atk {
  width: 44px; height: 44px;
  background-color: var(--gold);
  border-radius: 22px;
  align-items: center; justify-content: center;
}
.minion-atk-tx { font-size: 28px; min-height: 36px; color: #2A1F02; font-weight: bold; white-space: normal; }
.minion-hp {
  width: 44px; height: 44px;
  background-color: var(--red);
  border-radius: 22px;
  align-items: center; justify-content: center;
}
.minion-hp-tx { font-size: 28px; min-height: 36px; color: var(--text); font-weight: bold; white-space: normal; }

.divider { flex-direction: row; align-items: center; justify-content: center; height: 60px; margin-bottom: 24px; }
.div-line { height: 3px; background-color: var(--line); flex-grow: 1; }
.turn-chip {
  flex-direction: row; align-items: center; justify-content: center;
  height: 60px;
  background-color: var(--gold);
  border-radius: 30px;
  padding: 0 36px;
  margin: 0 24px;
}
.turn-tx { font-size: 30px; min-height: 38px; color: #2A1F02; font-weight: bold; white-space: normal; }

/* ---------- hand ---------- */
.hand { flex-direction: row; align-items: flex-end; justify-content: center; height: 280px; margin-top: 12px; }
.hcard {
  width: 156px; height: 240px;
  background-color: var(--panel2);
  border-radius: 18px;
  border-width: 4px; border-color: var(--rune);
  flex-direction: column;
  align-items: center;
  padding: 10px;
  margin: 0 -8px;
}
.hcard-up { margin-bottom: 36px; }
.hcard-cost {
  width: 48px; height: 48px;
  background-color: var(--mana);
  border-radius: 24px;
  align-items: center; justify-content: center;
  margin-bottom: 8px;
}
.hcard-cost-tx { font-size: 30px; min-height: 38px; color: #08222A; font-weight: bold; white-space: normal; }
.hcard-art {
  width: 120px; height: 96px;
  background-color: var(--bg1);
  border-radius: 12px;
  align-items: center; justify-content: center;
  margin-bottom: 6px;
}
.hcard-name { font-size: 22px; min-height: 28px; color: var(--text); font-weight: bold; white-space: normal; }
</style>
</head>
