<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>
<!-- yoga-reset:end -->
<style>
:root {
  --bg0: #16102E;
  --bg1: #1F1742;
  --panel: #2A1F58;
  --panel2: #362873;
  --line: #4A3A8C;
  --gold: #F2C14E;
  --gold-d: #C9971F;
  --rune: #B06BFF;
  --rune-d: #7E3FD6;
  --mana: #3FC8E8;
  --mana-d: #1E96B8;
  --text: #EDE8FF;
  --text-dim: #9486C4;
  --red: #FF5A6E;
  --green: #5BE0A0;
}

.page {
  width: 1080px;
  height: 1920px;
  background-color: var(--bg0);
  padding: 64px 56px;
  flex-direction: column;
}

/* ---------- top rank bar ---------- */
.topbar { flex-direction: row; align-items: center; height: 96px; margin-bottom: 48px; }
.rank-chip {
  flex-direction: row; align-items: center;
  height: 96px;
  background-color: var(--panel);
  border-radius: 24px;
  border-width: 3px; border-color: var(--gold);
  padding: 0 32px 0 16px;
  flex-grow: 1;
  margin-right: 24px;
}
.rank-medal {
  width: 68px; height: 68px;
  background-color: var(--gold-d);
  border-radius: 20px;
  align-items: center; justify-content: center;
  margin-right: 20px;
}
.rank-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.rank-name { font-size: 34px; min-height: 42px; color: var(--gold); font-weight: bold; white-space: normal; }
.rank-sub { font-size: 24px; min-height: 30px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 2px; }
.gem-chip {
  flex-direction: row; align-items: center;
  height: 96px;
  background-color: var(--panel);
  border-radius: 24px;
  border-width: 3px; border-color: var(--line);
  padding: 0 28px 0 14px;
}
.gem-ico { width: 48px; height: 48px; margin-right: 14px; }
.gem-tx { font-size: 34px; min-height: 42px; color: var(--mana); font-weight: bold; white-space: normal; }

/* ---------- brand ---------- */
.brand { flex-direction: column; align-items: center; margin-bottom: 56px; margin-top: 24px; }
.brand-crest {
  width: 200px; height: 200px;
  background-color: var(--panel);
  border-radius: 60px;
  border-width: 5px; border-color: var(--rune);
  align-items: center; justify-content: center;
  margin-bottom: 32px;
}
.logo1 { font-size: 120px; color: var(--gold); font-weight: bold; white-space: normal; }
.logo2 { font-size: 88px; color: var(--rune); font-weight: bold; white-space: normal; margin-top: -16px; }
.brand-sub { font-size: 30px; min-height: 38px; color: var(--text-dim); font-weight: bold; white-space: normal; margin-top: 16px; }

/* ---------- menu buttons ---------- */
.menu { flex-direction: column; flex-grow: 1; justify-content: center; }
.mbtn {
  flex-direction: row; align-items: center;
  height: 168px;
  border-radius: 36px;
  border-width: 4px;
  padding: 0 44px;
  margin-bottom: 32px;
}
.mbtn-battle { background-color: var(--gold); border-color: var(--gold-d); }
.mbtn-deck { background-color: var(--panel); border-color: var(--rune); }
.mbtn-shop { background-color: var(--panel); border-color: var(--mana); }
.mbtn-last { margin-bottom: 0; }
.mbtn-ico {
  width: 96px; height: 96px;
  border-radius: 28px;
  align-items: center; justify-content: center;
  margin-right: 36px;
}
.ico-dark { background-color: #4A3A05; }
.ico-rune { background-color: var(--rune-d); }
.ico-mana { background-color: var(--mana-d); }
.mbtn-txw { flex-direction: column; justify-content: center; flex-grow: 1; }
.mbtn-tx { font-size: 52px; font-weight: bold; white-space: normal; }
.mbtn-tx-dark { color: #2A1F02; }
.mbtn-tx-light { color: var(--text); }
.mbtn-d { font-size: 26px; min-height: 32px; font-weight: bold; white-space: normal; margin-top: 4px; }
.mbtn-d-dark { color: #6B5410; }
.mbtn-d-dim { color: var(--text-dim); }
.mbtn-arr { width: 48px; height: 48px; }
</style>
</head>
<body>
  <div class="page">

    <div class="topbar">
      <div class="rank-chip">
        <div class="rank-medal">
          <svg id="icon-medal" width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="16" r="11" fill="#F2C14E"/>
            <path d="M13 24 L9 38 L20 31 L31 38 L27 24 Z" fill="#F2C14E"/>
          </svg>
        </div>
        <div class="rank-txw">
          <span class="rank-name">秘银 III</span>
          <span class="rank-sub">天梯积分 1,840</span>

      <div class="gem-chip">

          <path d="M24 6 L40 18 L24 42 L8 18 Z" fill="#3FC8E8"/>

    <div class="brand">

          <path d="M60 36 L48 58 L58 58 L46 82 L72 52 L60 52 Z" fill="#F2C14E"/>
        </svg>
      </div>
      <span class="logo1">ARCANE</span>
      <span class="logo2">CLASH</span>
      <span class="brand-sub">奥术对决 · 策略卡牌</span>
    </div>

    <div class="menu">
      <div class="mbtn mbtn-battle">
        <div class="mbtn-ico ico-dark">
          <svg id="icon-sword" width="60" height="60" viewBox="0 0 60 60">
            <path d="M14 46 L18 50 L34 34 L30 30 Z" fill="#F2C14E"/>
            <path d="M30 30 L46 14 L50 10 L48 20 L38 22 L34 34 Z" fill="#F2C14E"/>
            <path d="M46 14 L52 8 L50 18 Z" fill="#F2C14E"/>
          </svg>
        </div>
        <div class="mbtn-txw">
          <span class="mbtn-tx mbtn-tx-dark">开始对战</span>
          <span class="mbtn-d mbtn-d-dark">RANKED · 排位天梯</span>
        </div>
        <svg id="icon-arr1" class="mbtn-arr" width="48" height="48" viewBox="0 0 48 48">
          <path d="M18 10 L33 24 L18 38" stroke="#2A1F02" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="mbtn mbtn-deck">
        <div class="mbtn-ico ico-rune">

            <rect x="14" y="16" width="22" height="32" rx="4" fill="#EDE8FF" transform="rotate(-10 25 32)"/>
            <rect x="24" y="14" width="22" height="32" rx="4" fill="#B06BFF"/>
          </svg>
        </div>
        <div class="mbtn-txw">
          <span class="mbtn-tx mbtn-tx-light">卡组编辑</span>
          <span class="mbtn-d mbtn-d-dim">DECKS · 4 套卡组</span>
        </div>
        <svg id="icon-arr2" class="mbtn-arr" width="48" height="48" viewBox="0 0 48 48">
          <path d="M18 10 L33 24 L18 38" stroke="#9486C4" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="mbtn mbtn-shop mbtn-last">
        <div class="mbtn-ico ico-mana">
          <svg id="icon-pack" width="60" height="60" viewBox="0 0 60 60">
            <path d="M14 18 L46 18 L42 48 L18 48 Z" fill="#3FC8E8"/>
            <path d="M22 18 L26 10 L34 10 L38 18 Z" fill="#3FC8E8"/>
            <rect x="27" y="24" width="6" height="20" fill="#16102E"/>
          </svg>
        </div>
        <div class="mbtn-txw">
          <span class="mbtn-tx mbtn-tx-light">卡包商店</span>
          <span class="mbtn-d mbtn-d-dim">SHOP · 新版本上架</span>
        </div>
        <svg id="icon-arr3" class="mbtn-arr" width="48" height="48" viewBox="0 0 48 48">
          <path d="M18 10 L33 24 L18 38" stroke="#9486C4" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

  </div>
</body>
</html>
