<!DOCTYPE html>
<html>
<head>
<!-- yoga-reset:start (managed by normalize_source.py — single source: ai-uitoolkit-creator-skill/templates/yoga-base.css) -->
<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的

 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }

<style>
:root {
  --night0: #0B1026;
  --night1: #161E45;
  --panel: #1E2A5E;
  --panel2: #283A7A;
  --line: #3A4E96;
  --green: #5CF270;
  --green-d: #2BAA3E;
  --orange: #FF9D3A;
  --orange-d: #C96A12;
  --pink: #FF5C8A;
  --red: #FF4D4D;
  --text: #EAF0FF;
  --text-dim: #8C9BD6;
  --gold: #FFD23F;
}

.page {
  width: 1920px;
  height: 1080px;
  background-color: var(--night0);
  padding: 48px 56px;
  flex-direction: column;
  justify-content: space-between;
}

/* ---------- top HUD row ---------- */
.hud-top { flex-direction: row; align-items: flex-start; justify-content: space-between; min-height: 96px; }

.hud-left { flex-direction: column; min-height: 96px; }
.lives {
  flex-direction: row; align-items: center;
  height: 88px;
  background-color: var(--night1);
  border-width: 5px; border-color: var(--line);
  padding: 0 28px;
  margin-bottom: 20px;
}
.heart { width: 48px; height: 48px; margin-right: 14px; }
.heart-last { margin-right: 18px; }
.lives-x { font-size: 34px; color: var(--text); font-weight: bold; white-space: normal; }

.coin-hud {
  flex-direction: row; align-items: center;
  height: 80px;
  background-color: var(--night1);
  border-width: 5px; border-color: var(--line);
  padding: 0 28px;
}
.coin-hud-ico { width: 44px; height: 44px; margin-right: 16px; }
.coin-hud-tx { font-size: 36px; min-height: 44px; color: var(--gold); font-weight: bold; white-space: normal; }

.hud-mid { flex-direction: column; align-items: center; min-height: 96px; }
.stage-tag {
  flex-direction: row; align-items: center; justify-content: center;
  height: 60px;
  background-color: var(--panel2);
  border-width: 4px; border-color: var(--line);
  padding: 0 28px;
  margin-bottom: 16px;
}
.stage-tag-tx { font-size: 28px; min-height: 34px; color: var(--green); font-weight: bold; white-space: normal; }
.timer {
  flex-direction: row; align-items: center; justify-content: center;
  width: 280px; height: 96px;
  background-color: var(--night1);
  border-width: 5px; border-color: var(--orange);
}
.timer-ico { width: 44px; height: 44px; margin-right: 16px; }
.timer-tx { font-size: 56px; color: var(--orange); font-weight: bold; white-space: normal; }

.hud-right { flex-direction: column; align-items: flex-end; min-height: 96px; }
.pause {
  width: 96px; height: 96px;
  background-color: var(--night1);
  border-width: 5px; border-color: var(--line);
  align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.gems-hud {
  flex-direction: row; align-items: center;
  height: 80px;
  background-color: var(--night1);
  border-width: 5px; border-color: var(--line);
  padding: 0 28px;
}
.gem-hud-ico { width: 40px; height: 40px; margin-right: 14px; }
.gem-hud-tx { font-size: 34px; min-height: 40px; color: var(--green); font-weight: bold; white-space: normal; }

/* ---------- center stage hint ---------- */
.stage-area {
  flex-grow: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hero-block {
  width: 120px; height: 120px;
  background-color: var(--green);
  border-width: 6px; border-color: var(--green-d);
  align-items: center; justify-content: center;
  margin-bottom: 24px;
}
.stage-hint { font-size: 30px; color: var(--text-dim); font-weight: bold; white-space: normal; }

/* ---------- bottom controls ---------- */
.controls { flex-direction: row; align-items: flex-end; justify-content: space-between; }

.dpad { flex-direction: row; align-items: center; }
.ctrl-btn {
  width: 150px; height: 150px;
  background-color: var(--night1);
  border-width: 6px; border-color: var(--line);
  align-items: center; justify-content: center;
}
.ctrl-left { margin-right: 24px; }

.action-pad { flex-direction: row; align-items: flex-end; }
.btn-attack {
  width: 150px; height: 150px;
  background-color: var(--orange);
  border-width: 6px; border-color: var(--orange-d);
  align-items: center; justify-content: center;
  margin-right: 28px;
}
.btn-jump {
  width: 196px; height: 196px;
  background-color: var(--green);
  border-width: 7px; border-color: var(--green-d);
  align-items: center; justify-content: center;
}
.btn-lbl { font-size: 26px; font-weight: bold; white-space: normal; margin-top: 6px; }
.btn-lbl-dark { color: #0B1026; }
.btn-col { flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
