<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
  .stage {
    width: 1920px;
    height: 1080px;
    background-color: #12141F;
    flex-direction: column;
  }

  /* Top bar with back */
  .topbar {
    flex-direction: row;
    align-items: center;
    height: 88px;
    padding: 0 40px;
    background-color: #1A1D2C;
    border-bottom-width: 2px;
    border-bottom-color: #2C3142;
  }
  .back-btn {
    flex-direction: row;
    align-items: center;
    justify-content: center;
    width: 116px;
    height: 52px;
    border-radius: 12px;
    background-color: #232739;
    border-width: 1px;
    border-color: #343A50;
    margin-right: 24px;
  }
  .back-ic { width: 22px; height: 22px; margin-right: 8px; }
  .back-tx { font-size: 18px; color: #F4F6FF; -unity-font-style: bold; }
  .crumb { font-size: 20px; color: #8B93AD; }
  .crumb-strong { font-size: 20px; color: #F2C14E; -unity-font-style: bold; }

  .body { flex-direction: row; flex-grow: 1; padding: 36px 40px; }

  /* Left: portrait card */
  .portrait-col { width: 560px; flex-direction: column; margin-right: 36px; }
  .portrait-card {
    flex-direction: column;
    align-items: center;
    background-color: #1A1D2C;
    border-radius: 24px;
    border-width: 2px;
    border-color: #A878F0;
    padding: 32px;
    margin-bottom: 28px;
  }
  .stars { flex-direction: row; justify-content: center; margin-bottom: 20px; }
  .star { width: 40px; height: 40px; margin-right: 8px; }
  .portrait-art {
    width: 360px;
    height: 360px;
    border-radius: 20px;
    background-color: #1F2333;
    border-width: 2px;
    border-color: #2C3142;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .piece-name { font-size: 48px; color: #F4F6FF; -unity-font-style: bold; }
  .piece-title { font-size: 22px; color: #A878F0; margin-top: 8px; letter-spacing: 3px; }
  .cost-pill {
    flex-direction: row;
    align-items: center;
    justify-content: center;
    height: 56px;
    padding: 0 28px;
    margin-top: 22px;
    border-radius: 28px;
    background-color: #2C2718;
    border-width: 1px;
    border-color: #F2C14E;
  }
  .cost-pill-ic { width: 26px; height: 26px; margin-right: 10px; }
  .cost-pill-tx { font-size: 24px; color: #F2C14E; -unity-font-style: bold; }

  /* stat grid */
  .stat-grid { flex-direction: row; justify-content: space-between; }
  .stat-box {
    width: 174px;
    height: 100px;
    border-radius: 16px;
    background-color: #1A1D2C;
    border-width: 1px;
    border-color: #2C3142;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .stat-box-ic { width: 28px; height: 28px; margin-bottom: 8px; }
  .stat-box-num { font-size: 30px; color: #F4F6FF; -unity-font-style: bold; }
  .stat-box-cap { font-size: 14px; color: #8B93AD; margin-top: 4px; }

  /* Right: skill + synergies + combine */
  .detail-col { flex-grow: 1; flex-direction: column; }
  .section {
    flex-direction: column;
    background-color: #1A1D2C;
    border-radius: 20px;
    border-width: 1px;
    border-color: #2C3142;
    padding: 28px;
    margin-bottom: 26px;
  }
  .sec-head { flex-direction: row; align-items: center; margin-bottom: 20px; }
  .sec-ic { width: 32px; height: 32px; margin-right: 14px; }
  .sec-title { font-size: 26px; color: #F4F6FF; -unity-font-style: bold; }

  .skill-name-row { flex-direction: row; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .skill-name { font-size: 24px; color: #4FD6C9; -unity-font-style: bold; }
  .mana-pill {
    flex-direction: row;
    align-items: center;
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    background-color: #1B2238;
    border-width: 1px;
    border-color: #4F76D6;

  .mana-tx { font-size: 17px; color: #9CC3FF; -unity-font-style: bold; }
  .skill-desc { font-size: 20px; color: #C2C8DE; white-space: normal; }
  .skill-vals { flex-direction: row; margin-top: 20px; }
  .skill-val {
    flex-direction: column;
    align-items: center;
    width: 150px;
    height: 86px;
    border-radius: 14px;
    background-color: #232739;
    justify-content: center;
    margin-right: 16px;
  }
  .skill-val-num { font-size: 26px; color: #F2C14E; -unity-font-style: bold; }
  .skill-val-cap { font-size: 14px; color: #8B93AD; margin-top: 6px; }

  .syn-tags { flex-direction: row; }
  .syn-tag {
    flex-direction: row;
    align-items: center;
    height: 64px;
    padding: 0 22px;
    margin-right: 16px;
    border-radius: 14px;
    background-color: #232739;
    border-width: 1px;
    border-color: #343A50;
  }
  .syn-tag-ic { width: 32px; height: 32px; margin-right: 12px; }
  .syn-tag-tx { font-size: 20px; color: #F4F6FF; -unity-font-style: bold; }

  /* combine hint */
  .combine { flex-direction: row; align-items: center; justify-content: center; }
  .cmb-unit {
    width: 96px;
    height: 96px;
    border-radius: 16px;
    background-color: #232739;
    border-width: 2px;
    border-color: #5A6076;
    align-items: center;
    justify-content: center;
  }
  .cmb-unit.gold { border-color: #F2C14E; }
  .cmb-plus { font-size: 40px; color: #8B93AD; -unity-font-style: bold; margin: 0 18px; }
  .cmb-eq { font-size: 40px; color: #F2C14E; -unity-font-style: bold; margin: 0 24px; }
  .cmb-result {
    width: 118px;
    height: 118px;
    border-radius: 18px;
    background-color: #2C2718;
    border-width: 2px;
    border-color: #F2C14E;
    align-items: center;
    justify-content: center;
  }
  .cmb-note { font-size: 18px; color: #9AA1BC; margin-left: 30px; white-space: normal; flex-grow: 1; }
</style>

<body>
  <div class="stage">

          </div>

          <div class="cost-pill">

            <span class="stat-box-num">65</span>
            <span class="stat-box-cap">攻击</span>
          </div>
          <div class="stat-box">
            <svg id="pc-arm" width="28" height="28" viewBox="0 0 28 28" class="stat-box-ic"><path d="M14 3l9 4v7c0 6-4 9-9 11-5-2-9-5-9-11V7z" fill="#4F76D6"/></svg>
            <span class="stat-box-num">40</span>
            <span class="stat-box-cap">护甲</span>

        </div>
      </div>

      <!-- Detail column -->
      <div class="detail-col">

        <div class="section">
          <div class="sec-head">
            <svg id="pc-sec-skill" width="32" height="32" viewBox="0 0 32 32" class="sec-ic"><path d="M16 3l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#4FD6C9"/></svg>
            <span class="sec-title">技能</span>
          </div>
          <div class="skill-name-row">
            <span class="skill-name">虚空裂隙</span>
            <div class="mana-pill"><span class="mana-tx">法力 0 / 80</span></div>
          </div>
          <span class="skill-desc">向最远的敌人区域撕开一道虚空裂隙,造成范围魔法伤害并使命中目标的护甲降低,持续 4 秒。每命中一名敌人,自身获得一层护盾叠加。</span>
          <div class="skill-vals">
            <div class="skill-val"><span class="skill-val-num">320</span><span class="skill-val-cap">基础魔法伤害</span></div>

        <div class="section">

          <div class="syn-tags">

              <span class="syn-tag-tx">守护者</span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="sec-head">
            <svg id="pc-sec-cmb" width="32" height="32" viewBox="0 0 32 32" class="sec-ic"><path d="M16 4v24M4 16h24" stroke="#F2C14E" stroke-width="3"/></svg>

          <div class="combine">
