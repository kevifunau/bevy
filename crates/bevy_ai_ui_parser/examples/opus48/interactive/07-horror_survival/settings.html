<!DOCTYPE html>

<head>

<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。

 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
.stage {
  width: 1920px;
  height: 1080px;
  background-color: #07090A;
  overflow: hidden;
}
.bg { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background-color: #0A0E0D; }
.vignette {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  background-color: #00000000;
  border-width: 160px; border-color: #03040400;
  border-top-color: #030404; border-bottom-color: #030404;
}
/* header */
.header {
  position: absolute; top: 0; left: 0;
  flex-direction: row; align-items: center; justify-content: space-between;
  width: 1920px; height: 88px; padding: 0 48px;
  background-color: #0A0F0E; border-bottom-width: 1px; border-bottom-color: #1B2522;
}
.h-left { flex-direction: row; align-items: center; }
.back-btn {
  flex-direction: row; align-items: center; justify-content: center;
  width: 52px; height: 52px; margin-right: 22px;
  background-color: #0E1413; border-width: 1px; border-color: #243330; border-radius: 6px;
}
.back-btn .bk-ico { width: 24px; height: 24px; }
.h-titles { align-items: flex-start; }
.h-title { font-size: 30px; color: #DDE9E4; letter-spacing: 8px; }
.h-sub { font-size: 14px; color: #5C6B66; letter-spacing: 4px; margin-top: 4px; }
.restore {
  flex-direction: row; align-items: center; justify-content: center;
  width: 200px; height: 56px;
  background-color: #1A0E0D; border-width: 1px; border-color: #4A2220; border-radius: 8px;
}
.restore .rs-ico { width: 22px; height: 22px; margin-right: 12px; }
.restore-txt { font-size: 16px; color: #B07A72; letter-spacing: 2px; }

/* body two columns */
.body {
  position: absolute; top: 88px; left: 0;
  flex-direction: row; width: 1920px; height: 904px; padding: 40px 48px;
}
.col { width: 880px; margin-right: 32px; }
.col-2 { width: 880px; margin-right: 0; }
.sect-title { flex-direction: row; align-items: center; margin-bottom: 16px; }
.st-bar { width: 4px; height: 22px; background-color: #5FD3C0; margin-right: 12px; border-radius: 2px; }
.st-name { font-size: 20px; color: #C9D6D0; letter-spacing: 4px; }
.panel {
  width: 880px; margin-bottom: 28px;
  background-color: #0D1211; border-width: 1px; border-color: #1C2724;
  border-radius: 10px; padding: 12px 26px;
}
.row {
  flex-direction: row; align-items: center; justify-content: space-between;
  width: 828px; height: 84px;
  border-bottom-width: 1px; border-bottom-color: #141C1A;
}
.row.last { border-bottom-width: 0; }
.row-label { flex-direction: row; align-items: center; }
.rl-ico { width: 24px; height: 24px; margin-right: 16px; }
.rl-text { align-items: flex-start; }
.rl-name { font-size: 19px; color: #C9D6D0; letter-spacing: 2px; margin-bottom: 3px; }
.rl-desc { font-size: 13px; color: #5C6B66; }

/* skinned switch */
.switch {
  flex-direction: row; align-items: center; justify-content: flex-start;
  width: 92px; height: 48px; border-radius: 24px;
  background-color: #0A0F0E; border-width: 1px; border-color: #243330; padding: 0 5px;
}
.switch.is-on { background-color: #112320; border-color: #5FD3C0; justify-content: flex-end; }
.switch-knob { width: 38px; height: 38px; border-radius: 19px; background-color: #44524D; }
.switch.is-on .switch-knob { background-color: #5FD3C0; }

/* skinned slider */
.slider { width: 440px; height: 48px; flex-direction: row; align-items: center; justify-content: flex-start; }
.slider-track {
  flex-direction: row; align-items: center;
  width: 400px; height: 14px; border-radius: 7px; background-color: #080B0A;
  border-width: 1px; border-color: #1E2A27;
}
.slider-fill { height: 12px; border-radius: 6px; background-color: #5FD3C0; }
.sl-62 { width: 248px; }
.sl-40 { width: 160px; }
.slider-knob {
  width: 28px; height: 28px; border-radius: 14px;
  background-color: #DDE9E4; border-width: 3px; border-color: #5FD3C0;
}
.slider-val { width: 52px; font-size: 17px; color: #8FA29B; margin-left: 14px; }

/* skinned segmented chooser */
.seg {
  flex-direction: row; height: 48px; padding: 4px;
  background-color: #0A0F0E; border-width: 1px; border-color: #1E2A27; border-radius: 8px;
}
.seg-btn {
  align-items: center; justify-content: center;
  width: 110px; height: 40px; border-radius: 6px; background-color: #00000000;
}
.seg-btn.is-active { background-color: #112320; border-width: 1px; border-color: #2E5E56; }
.seg-txt { font-size: 16px; color: #6E7B75; letter-spacing: 2px; }
.seg-btn.is-active .seg-txt { color: #5FD3C0; }

/* skinned picker */
.picker {
  flex-direction: row; align-items: center; justify-content: space-between;
  width: 280px; height: 56px; padding: 0 18px;
  background-color: #0A0F0E; border-width: 1px; border-color: #243330; border-radius: 8px;
}
.picker-value { font-size: 18px; color: #C9D6D0; letter-spacing: 1px; }
.picker-caret { width: 18px; height: 18px; }
</style>
</head>
<body>

            </div>
            <div class="switch"><div class="switch-knob"></div></div>

        </div>

            <div class="row-label">
