<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的

 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }

<style>
.stage {
  width: 1920px;
  height: 1080px;
  flex-direction: row;
  background-color: #070B18;
}

/* left: placement hero */
.hero {
  width: 760px;
  height: 1080px;
  background-color: #0B1430;

  height: 320px;

  border-width: 6px;
  border-color: #FFE100;
  align-items: center;
  justify-content: center;
  margin-bottom: 40px;

.place-inner { flex-direction: column; align-items: center; justify-content: center; }
.place-num { flex-direction: row; align-items: flex-start; justify-content: center; }
.place-val { font-size: 150px; color: #FFE100; font-weight: bold; }

.place-label { font-size: 22px; color: #9FB0DE; letter-spacing: 6px; margin-top: 4px; }

.hero-car { flex-direction: row; align-items: center; }
.hero-car-thumb {
  width: 150px;
  height: 90px;
  border-radius: 14px;
  background-color: #060B1A;
  border-width: 1px;

  justify-content: center;
  margin-right: 20px;

.hero-car-meta { flex-direction: column; justify-content: center; }
.hero-car-name { font-size: 28px; color: #FFFFFF; font-weight: bold; margin-bottom: 4px; }
.hero-car-track { font-size: 16px; color: #6B7CA8; }

/* right: details */
.details {
  width: 1160px;
  height: 1080px;
  padding: 64px 64px;
  flex-direction: column;
}
.det-section-title { font-size: 18px; color: #6B7CA8; letter-spacing: 4px; margin-bottom: 22px; }

/* time + stats grid */
