<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联
 * <style data-yoga-reset> 引入它，使其在裸浏览器里就按 Yoga 规则排版;
 * 编译器(main.py)预览注入同一份内容。两侧都用 data-yoga-reset 标记,
 * html_parser 会把带该标记的 <style>/<link> 排除出 lint 与 USS 翻译,
 * 所以这段 reset 永远不会污染产物 USS,也不会触发 structure_lint 的
 * 通配选择器(*)禁令。
 *
 * 全部用通配选择器(specificity 0),不会覆盖作者类样式。
 * !! 修改这里即同时影响源 HTML 预览与编译器预览,改完需重编验证。 */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;          /* Yoga 默认 0；Web 默认 1 会压扁固定尺寸子项 */
  line-height: 1.2;
}
html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;
  overflow: auto;
}
head, head *, style, link, meta, title, script { display: none; }
</style>

<style>
.stage {
  width: 1920px;
  height: 1080px;
  flex-direction: row;
  background-color: #0E0B0A;
  padding: 0;
}

/* ===== LEFT: scene / illustration ===== */
.scene-col {
  width: 720px;
  height: 1080px;
  background-color: #16110E;
  border-right-width: 3px; border-right-color: #2C211A;
  padding: 56px 56px;
  justify-content: space-between;
}
.scene-tag {
  flex-direction: row; align-items: center;
  height: 44px; width: 220px;
  background-color: #211913;
  border-width: 1px; border-color: #C23B3B;
  border-radius: 22px;
  padding: 0 18px;
}
.scene-tag-ic { margin-right: 10px; }
.scene-tag-txt { font-size: 16px; color: #E07B5B; -unity-font-style: bold; letter-spacing: 2px; }
.scene-art {
  flex-grow: 1;
  margin: 40px 0;
  background-color: #0E0B0A;
  border-width: 2px; border-color: #3A2C20;
  border-radius: 20px;
  align-items: center; justify-content: center;
}
.scene-floor-row { flex-direction: row; align-items: center; }
.scene-floor-ic {
  width: 50px; height: 50px; border-radius: 12px;
  background-color: #211913; align-items: center; justify-content: center; margin-right: 14px;
}
.scene-floor-txt { font-size: 18px; color: #9C8A74; }

/* ===== RIGHT: event content ===== */
.content-col {
  flex-grow: 1;
  height: 1080px;
  padding: 64px 72px;
  justify-content: space-between;
}
.event-head { flex-direction: column; }
.event-kicker {
  font-size: 18px; color: #E0A94B; letter-spacing: 6px;
  -unity-font-style: bold; margin-bottom: 14px;
}
.event-title {
  font-size: 56px; color: #F3D08A; -unity-font-style: bold;
  -unity-text-outline-width: 1px; -unity-text-outline-color: #6B4A1F;
}
.event-desc {
  font-size: 22px; color: #C8B79E;
  margin-top: 26px;
  width: 980px;
  white-space: normal;
}
.event-desc-2 {
  font-size: 22px; color: #C8B79E;
  margin-top: 16px;
  width: 980px;
  white-space: normal;
}

/* choices */
.choices { flex-direction: column; margin-top: 8px; }
.choice {
  flex-direction: row;
  align-items: center;
  height: 116px;
  background-color: #16110E;
  border-width: 2px; border-color: #2C211A;
  border-radius: 16px;
  padding: 0 26px;
  margin-bottom: 20px;
}
.choice.risk { border-color: #5A2424; }
.choice.safe { border-color: #2C4A2E; }
.choice.reward { border-color: #6B4A1F; }
.choice-ic {
  width: 70px; height: 70px; border-radius: 14px;
  background-color: #211913;
  align-items: center; justify-content: center; margin-right: 24px;
}
.choice-body { flex-grow: 1; justify-content: center; }
.choice-name { font-size: 26px; color: #EAD9C0; -unity-font-style: bold; }
.choice-hint-row { flex-direction: row; align-items: center; margin-top: 10px; }
.hint-pill {
  flex-direction: row; align-items: center;
  height: 30px; padding: 0 12px; border-radius: 8px;
  background-color: #211913; margin-right: 12px;
}
.hint-pill.danger { background-color: #2A1414; }
.hint-pill.good { background-color: #16261A; }
.hint-txt { font-size: 14px; color: #9C8A74; margin-left: 6px; }
.hint-txt.danger { color: #E07B5B; }
.hint-txt.good { color: #6FBF73; }
.choice-go {
  width: 60px; height: 60px; border-radius: 30px;
  background-color: #211913;
  align-items: center; justify-content: center;
}
.choice.risk .choice-go { background-color: #8E2727; }

/* footer */
.event-foot { flex-direction: row; align-items: center; justify-content: space-between; }
.foot-note { flex-direction: row; align-items: center; }
.foot-note-ic { margin-right: 10px; }
.foot-note-txt { font-size: 16px; color: #6E5E4C; }
.leave-btn {
  flex-direction: row; align-items: center;
  height: 56px; padding: 0 26px;
  background-color: #16110E;
  border-width: 1px; border-color: #2C211A;
  border-radius: 12px;
}
.leave-txt { font-size: 18px; color: #9C8A74; }
</style>
</head>

        </div>

    </div>
  </div>
