<style>
.stage {
  width: 1920px;
  height: 1080px;
  flex-direction: column;
  background-color: #0E0B0A;
  padding: 0;
}

/* ===== TOP STRIP: floor + minimap + enemy ===== */
.top-strip {
  flex-direction: row;
  align-items: flex-start;
  justify-content: space-between;
  height: 240px;
  padding: 28px 36px 0 36px;
}

/* floor / depth indicator (top-left) */
.floor-box {
  flex-direction: row;
  align-items: center;
  height: 96px;
  background-color: #16110E;
  border-width: 1px; border-color: #2C211A;
  border-radius: 16px;
  padding: 0 24px;
}
.floor-ic {
  width: 64px; height: 64px; border-radius: 14px;
  background-color: #211913; border-width: 2px; border-color: #E0A94B;
  align-items: center; justify-content: center; margin-right: 18px;
}
.floor-meta { justify-content: center; }
.floor-num { font-size: 30px; color: #F3D08A; -unity-font-style: bold; }
.floor-name { font-size: 16px; color: #9C8A74; margin-top: 4px; }

/* enemy info (top-center) */
.enemy-box {
  width: 560px;
  background-color: #16110E;
  border-width: 1px; border-color: #5A2424;
  border-radius: 16px;
  padding: 18px 24px;
}
.enemy-head { flex-direction: row; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.enemy-id { flex-direction: row; align-items: center; }
.enemy-ic {
  width: 50px; height: 50px; border-radius: 12px;
  background-color: #2A1414; align-items: center; justify-content: center; margin-right: 14px;
}
.enemy-name { font-size: 24px; color: #EAD9C0; -unity-font-style: bold; }
.enemy-tier { font-size: 14px; color: #C23B3B; -unity-font-style: bold; margin-top: 3px; }
.enemy-elite {
  flex-direction: row; align-items: center;
  height: 32px; padding: 0 12px; border-radius: 8px;
  background-color: #2A1414; border-width: 1px; border-color: #C23B3B;
}
.enemy-elite-txt { font-size: 14px; color: #E07B5B; -unity-font-style: bold; }
.enemy-hp { flex-direction: row; width: 100%; height: 20px; background-color: #211913; border-radius: 10px; }
.enemy-hp-fill { height: 20px; width: 72%; background-color: #C23B3B; border-radius: 10px; }
.enemy-tags { flex-direction: row; align-items: center; margin-top: 12px; }
.enemy-tag {
  flex-direction: row; align-items: center;
  height: 30px; padding: 0 12px; border-radius: 8px;
  background-color: #211913; margin-right: 10px;
}
.enemy-tag-txt { font-size: 13px; color: #9C8A74; margin-left: 6px; }

/* minimap (top-right) */
.minimap-box {

  border-width: 1px; border-color: #2C211A;

.itembar {

  background-color: #16110E;

.item-count {

}
.item-key {
  position: absolute; top: 5px; left: 8px;
  font-size: 12px; color: #6E5E4C; -unity-font-style: bold;
}
</style>
