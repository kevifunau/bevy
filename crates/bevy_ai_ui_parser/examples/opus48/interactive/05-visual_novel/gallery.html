<style data-yoga-reset>
/* yoga-base.css — Yoga(UIToolkit) vs CSS Web 默认值修正（单一事实源）。
 *
 * 这是让"浏览器预览"等价于 Unity UIDocument 的地基。源 HTML 通过内联

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-width: 0;
  border-style: solid;
  min-width: 0;
  min-height: 0;

html, body {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: auto;            /* 画布常高于视口，用 auto + 可滚动避免裁切 */
  min-height: 100%;

<style>
.page {
  width: 1080px;
  height: 1920px;
  background-color: #140E26;
  padding: 96px 70px 80px 70px;
  overflow: hidden;
}

/* header */
.header {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  height: 92px;
  margin-bottom: 36px;
}
.header-left {
  flex-direction: row;
  align-items: center;
}
.back-btn {
  width: 84px;
  height: 84px;
  border-radius: 26px;
  background-color: #1F1638;
  border-width: 1px;
  border-color: #4A3A7A;
  align-items: center;
  justify-content: center;
  margin-right: 28px;
}
.title-wrap {
  flex-direction: column;
}
.header-title {
  font-size: 54px;
  color: #F4E9C6;
  font-weight: bold;
  letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(232,199,122,0.35);
}
.header-sub {
  font-size: 26px;
  color: #8C7CB8;
  letter-spacing: 3px;
  margin-top: 4px;

  margin-bottom: 38px;
}
.comp-row {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.comp-label {
  flex-direction: row;
  align-items: center;
}
.comp-text {
  font-size: 30px;
  color: #D8CCF4;
  letter-spacing: 3px;
  margin-left: 14px;
}
.comp-pct {
  font-size: 32px;
  color: #E8C77A;
  font-weight: bold;
  letter-spacing: 2px;
}
.bar {
  flex-direction: row;
  width: 868px;
  height: 18px;
  border-radius: 9px;
  background-color: #0F0A1E;
}
.bar-fill {
  height: 18px;
  width: 520px;
  border-radius: 9px;
  background-color: #E8C77A;
}

/* tabs */
.seg {

  width: 940px;

.seg-btn {

  border-radius: 18px;
  background-color: #1A1330;
  margin-right: 8px;
}
.seg-btn-last { margin-right: 0; }
.seg-btn-label {
  font-size: 32px;
  color: #9A88C6;
  letter-spacing: 5px;
  margin-left: 12px;
}
.seg-btn.is-active { background-color: #E8C77A; }
.seg-btn.is-active .seg-btn-label { color: #2A1D08; font-weight: bold; }

/* gallery grid (nested flex rows) */
.grid {

.grid-row {

  width: 940px;

}
.card-name {

  color: #ECE3FB;

  letter-spacing: 2px;
  margin-bottom: 8px;
}
.card-name-locked { color: #5A4E80; }
.card-role {
  font-size: 26px;
  color: #9A88C6;
  letter-spacing: 2px;
}

.lock-icon {

}
.cg-orb {

  border-radius: 45px;
