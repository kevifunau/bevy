  padding: 0;

<style>
.page {

/* header */

.cloud-text {
  font-size: 26px;
  color: #7FD8B0;
  letter-spacing: 2px;
  margin-left: 12px;
}

  width: 940px;
  height: 96px;
  background-color: #1A1330;
  border-radius: 26px;
  border-width: 1px;

  margin-right: 8px;
}
.seg-btn-last { margin-right: 0; }
.seg-btn-label {
  font-size: 34px;
  color: #9A88C6;
  letter-spacing: 6px;
  margin-left: 14px;

.seg-btn.is-active {
